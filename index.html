<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Synca — New website coming soon</title>
    <meta name="description" content="Synca is creating a new digital experience. Our redesigned website is coming soon.">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fc;
        color: #111827;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #ffffff 0%, #f1f3fb 58%, #e9ecf7 100%);
      }
      main {
        width: min(680px, 100%);
        padding: clamp(36px, 7vw, 72px);
        border: 1px solid rgba(17, 24, 39, 0.08);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 80px rgba(31, 41, 55, 0.12);
        text-align: center;
      }
      .brand {
        margin: 0 0 32px;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }
      p {
        max-width: 480px;
        margin: 24px auto 0;
        color: #4b5563;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Synca</p>
      <h1>Something new is taking shape.</h1>
      <p>We’re redesigning the Synca website to create a clearer, sharper digital experience. Check back soon.</p>
    </main>
  </body>
</html>
